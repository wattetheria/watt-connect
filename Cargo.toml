[workspace]
members = [
    "apps/watt-connect",
    "apps/watt-connect-catalog",
    "crates/connect-catalog",
    "crates/connect-installer",
    "crates/connect-policy",
    "crates/connect-server",
    "crates/connect-testkit",
    "crates/connect-types",
    "crates/connect-upstream",
    "crates/connect-vault",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/wattetheria/watt-connect"
rust-version = "1.88"

[workspace.dependencies]
ed25519-dalek = "2.2"
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "form"] }
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
futures = "0.3"
hex = "0.4"
http = "1"
keyring = "4"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.8", default-features = false }
rpassword = "7"
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.2"
serde_json = { version = "1.0", features = ["preserve_order"] }
sse-stream = "0.2"
tempfile = "3.18"
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-std", "io-util", "process"] }
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
which = "8"
zeroize = "1.8"

connect-catalog = { path = "crates/connect-catalog" }
connect-installer = { path = "crates/connect-installer" }
connect-policy = { path = "crates/connect-policy" }
connect-server = { path = "crates/connect-server" }
connect-testkit = { path = "crates/connect-testkit" }
connect-types = { path = "crates/connect-types" }
connect-upstream = { path = "crates/connect-upstream" }
connect-vault = { path = "crates/connect-vault" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
